[project]
name = "care"
version = "1.0.0"
description = "CARE — Certifiable Automation for data REpair: a proposer-agnostic governance layer with a distribution-free bound on the error of auto-applied repairs"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]
bench = ["tqdm>=4.66"]
figures = ["matplotlib>=3.7"]
baselines = ["openai>=1.30"]
all = ["pytest>=8.0", "hypothesis>=6.100", "tqdm>=4.66", "matplotlib>=3.7", "openai>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["care*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
